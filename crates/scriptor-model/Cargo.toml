[package]
name = "scriptor-model"
description = "CPU reference model and GPU executors."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["dep:scriptor-cuda", "dep:cudarc", "scriptor-kernels/cuda", "scriptor-cuda/cuda"]

[dependencies]
half = "2"
scriptor-cuda = { path = "../scriptor-cuda", optional = true }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cuda-13000", "cublaslt", "dynamic-loading"] }
scriptor-kernels = { path = "../scriptor-kernels" }
scriptor-spec = { path = "../scriptor-spec" }
scriptor-weights = { path = "../scriptor-weights" }
thiserror = "2"

[dev-dependencies]
scriptor-chat = { path = "../scriptor-chat" }
scriptor-image = { path = "../scriptor-image" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
