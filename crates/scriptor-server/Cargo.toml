[package]
name = "scriptor-server"
description = "OpenAI-compatible HTTP surface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
kv-demand-diagnostic = ["scriptor-engine/kv-demand-diagnostic", "scriptor-spec/kv-demand-diagnostic"]

[dependencies]
scriptor-chat = { path = "../scriptor-chat" }
scriptor-engine = { path = "../scriptor-engine" }
scriptor-image = { path = "../scriptor-image" }
scriptor-spec = { path = "../scriptor-spec" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
