[package]
name = "scriptor-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Document OCR bridge: renders pages, detects layout, recognises regions through an OpenAI-compatible engine, and serves the OCR contract over HTTP"

[lib]
name = "scriptor_bridge"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
hayro.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
png = "0.17"
regex.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pki-types = "1"
scriptor-layout = { workspace = true, features = ["onnx"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
