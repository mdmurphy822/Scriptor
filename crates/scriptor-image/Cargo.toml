[package]
name = "scriptor-image"
description = "Image decoding and preprocessing reference."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["libjpeg"]
# Decode JPEG through the system libjpeg-turbo (bit-exact with PIL/torchvision decoding).
libjpeg = []
# Decode JPEG with the pure-Rust zune-jpeg decoder (not bit-exact with libjpeg-turbo).
zune = ["dep:zune-core", "dep:zune-jpeg"]

[build-dependencies]
cc = "1"

[dependencies]
base64 = "0.22"
half = "2"
image-webp = "0.2"
png = "0.18"
thiserror = "2"
zune-core = { version = "0.5", optional = true }
zune-jpeg = { version = "0.5", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
